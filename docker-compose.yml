services:
  postgres-db:
    image: postgres:15-alpine
    container_name: note_app_db
    restart: always
    environment:
      POSTGRES_USER: note_app_user
      POSTGRES_PASSWORD: note_app_password
      POSTGRES_DB: note_app_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: note_app_backend
    restart: always
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - DATABASE_URL=postgres://note_app_user:note_app_password@postgres-db:5432/note_app_db
    depends_on:
      - postgres-db
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    container_name: note_app_frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
